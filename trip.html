<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon voyage | Vacation Planner</title>

    <!-- Relie la page à la feuille de style -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Vacation Planner</h1>
    </header>

    <main>
        <h2 id="trip-title">Mon voyage</h2>
        <p id="trip-destination"></p>
        <p id="trip-dates"></p>

        <nav aria-label="Sections du voyage">
            <button type="button">Vue d’ensemble</button>
            <button type="button">Idées et carte</button>
            <button type="button">Itinéraire</button>
            <button type="button">Membres</button>
        </nav>

        <div class="overview">
            <section class="overview-card">
                <h3>Hébergement</h3>
                <p>Aucun hébergement ajouté pour le moment.</p>
            </section>
            <section class="overview-card">
                <h3>Idées du voyage</h3>
                <ul id="trip-activities"></ul>
            </section>
            <section class="overview-card">
                <h3>Carte du voyage</h3>
                <p>La carte apparaîtra ici.</p>
            </section>
        </div>

        <!-- Aperçu de l'itinéraire -->
         
        <div class="overview-details">
            <section class="overview-card">
                <h3>Itinéraire</h3>
                <p>Aucune activité n’est planifiée pour le moment.</p>
            </section>
            <!-- Aperçu des membres -->
            <section class="overview-card">
                <h3>Membres du voyage</h3>
                <p>Les membres apparaîtront ici.</p>
            </section>
        </div>

        <section>
            <h2>Activités</h2>
            <!-- Formulaire pour ajouter une activité -->
            <form id="activity-form">
                <label for="activity-name">Nom de l’activité</label>
                <input type="text" id="activity-name" required>
                <label for="activity-location">Emplacement (facultatif)</label>
            <input type="text" id="activity-location">
                <button type="submit">Ajouter</button>
            </form>
            <!-- Les activités seront affichées dans cette liste -->
            <ul id="activity-list"></ul>
        </section>
        
    </main>
    <script src="js/trip.js"></script>
</body>
</html>
