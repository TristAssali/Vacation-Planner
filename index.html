<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vacation Planner</title>
    <link rel="stylesheet" href="css/style.css">
</head>
    
    <body>

        <h1>Vacation Planner</h1>

        <h2>Créer un voyage</h2>

        <form id="trip-form" novalidate>
            <label for="trip-name">Nom du voyage</label>
            <input type="text" id="trip-name" required aria-describedby="trip-name-error">
            <p id="trip-name-error" class="field-error" hidden></p>

            <label for="destination">Destination</label>
            <input type="text" id="destination" required aria-describedby="destination-error">
            <p id="destination-error" class="field-error" hidden></p>

            <label for="departure-date">Date de départ</label>
            <input type="date" id="departure-date" aria-describedby="departure-date-error">
            <p id="departure-date-error" class="field-error" hidden></p>

            <label for="return-date">Date de retour</label>
            <input type="date" id="return-date" aria-describedby="return-date-error">
            <p id="return-date-error" class="field-error" hidden></p>

            <button type="submit">Créer le voyage</button>
        </form>

        <section id="trip-display">
        <h2>Mon voyage</h2>
        <p id="display-name"></p>
        <p id="display-destination"></p>
        <p id="display-departure"></p>
        <p id="display-return"></p>
        </section>

    </body>
    <script src="js/script.js"></script>

</html>
